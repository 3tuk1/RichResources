[mod-setting-name]
rich-resources-multiplier=Resource Richness Multiplier
rich-resources-randomness-factor=Randomness Factor
richresources-apply-to-existing-ores=Apply to existing ore patches
richresources-reset-processed-list=Reset processed ore list
rich-resources-infinite-min-base=Infinite Resource Minimum Base Amount
rich-resources-finite-min-base=Finite Resource Minimum Base Amount
rich-resources-maintenance-multiplier=Maintenance Multiplier (Processed Only)
richresources-apply-maintenance=Apply maintenance multiplier
richresources-enable-distance-bonus=Enable Distance Bonus
richresources-distance-interval=Distance Bonus Interval (tiles)
richresources-distance-rate=Distance Bonus Rate

[mod-setting-description]
rich-resources-multiplier=Sets the multiplier for all resource richness.\nAffects newly generated chunks.
rich-resources-randomness-factor=Adds random variance to the multiplier.\nExample: Multiplier 2.0, Factor 0.2 -> Result varies between 1.8 and 2.2.
richresources-apply-to-existing-ores=If enabled, the mod will also apply changes to already discovered ore patches.
richresources-reset-processed-list=Toggling this setting (ON<->OFF) clears the list of ores processed by this mod and increments the generation.\n[color=red]If 'Apply to existing ore patches' is ON, the multiplier will be immediately re-applied to all ore patches upon toggling.[/color]
rich-resources-infinite-min-base=If an infinite resource (Oil etc.) has amount less than this value, this amount is used as base before multiplication.\nUsed to ensure depleted oil wells can be restored with a reasonable yield. Default: 30000 (10%)
rich-resources-finite-min-base=If a finite resource has an amount less than this value, this amount is used as the base before multiplication.
rich-resources-maintenance-multiplier=Sets the multiplier to apply ONLY to resources that have already been processed by this mod.
richresources-apply-maintenance=Toggling this setting (ON<->OFF) immediately applies the "Maintenance Multiplier" to already processed resources.\n[color=yellow]Unprocessed resources are ignored.[/color]
richresources-enable-distance-bonus=If enabled, adds extra multiplier based on the distance from the starting location (0,0).\nFormula: Final Multiplier = Base Multiplier * (1 + (Distance / Interval) * Rate)
richresources-distance-interval=The interval distance (in tiles) for calculation. Default: 1000
richresources-distance-rate=The bonus rate added per interval.\nExample: 0.5 means +50% increase to the final multiplier per interval.

[gui]
rich-resources-applied-message=Applied multiplier to resource patches.
