[mod-setting-name]
rich-resources-multiplier=资源丰富度倍率
rich-resources-randomness-factor=随机波动因子
richresources-apply-to-existing-ores=应用到已生成的矿脉
richresources-reset-processed-list=重置已处理列表
rich-resources-infinite-min-base=无限资源最低基数值
rich-resources-finite-min-base=有限资源最低基数值
richresources-tasks-per-tick=每Tick最大任务数 (性能)
rich-resources-maintenance-multiplier=维护倍率（仅限已处理资源）
richresources-apply-maintenance=应用维护倍率
richresources-enable-distance-bonus=启用距离加成
richresources-distance-interval=距离加成间隔（格）
richresources-distance-rate=距离加成比率

[mod-setting-description]
rich-resources-multiplier=设置所有资源丰富度的倍率。\n影响新生成的区块。
rich-resources-randomness-factor=为倍率添加随机波动。\n例如：倍率 2.0，因子 0.2 -> 结果在 1.8 到 2.2 之间变化。
richresources-apply-to-existing-ores=如果启用，模组也将把更改应用到已发现的矿脉。
richresources-reset-processed-list=切换此设置 (ON<->OFF) 将清除此模组处理过的矿石列表并增加世代数。\n[color=red]如果“应用到已生成的矿脉”开启，切换时倍率将立即重新应用到所有矿脉。[/color]
rich-resources-infinite-min-base=如果无限资源（如石油）的数量低于此值，则在乘法计算前使用此值作为基数。\n用于确保枯竭的油井能恢复到合理的产量。默认值：30000 (10%)
rich-resources-finite-min-base=如果有限资源的数量低于此值，则在乘法计算前使用此值作为基数。
richresources-tasks-per-tick=每Tick（1/60秒）处理的最大区块数。\n控制应用更改的速度。数值越高完成越快，但可能会导致UPS下降。\n推荐值：10（低配置），50（标准），200（高性能）。
rich-resources-maintenance-multiplier=设置仅应用于已被此模组处理过的资源的倍率。
richresources-apply-maintenance=切换此设置 (ON<->OFF) 将立即把“维护倍率”应用到已处理的资源。\n[color=yellow]未处理的资源将被忽略。[/color]
richresources-enable-distance-bonus=如果启用，将根据距离起始位置 (0,0) 的远近添加额外的倍率。\n公式：最终倍率 = 基础倍率 * (1 + (距离 / 间隔) * 比率)
richresources-distance-interval=用于计算的距离间隔（以格为单位）。默认值：1000
richresources-distance-rate=每个间隔增加的额外倍率系数。\n例如：0.5 表示每个间隔最终倍率增加 50%。

[gui]
rich-resources-applied-message=已将倍率应用到资源矿脉。

[message]
rich-resources-multiplier-updated=倍率已更新为: __1__
rich-resources-stops-applying=停止应用到现有矿石。
rich-resources-processed-chunks-reset=已处理区块列表重置。世代: __1__
rich-resources-queueing-maintenance=正在将维护任务加入队列 (x__1__)...
rich-resources-started-queued-task=开始执行队列任务: __1__ x__2__
rich-resources-finished-applying=已完成应用到现有区块。
rich-resources-starting-next-job=开始下一个队列任务: __1__
rich-resources-job-already-running=任务已经在运行中。
rich-resources-recalculation-started=开始重新计算现有资源: __1__ 区块
