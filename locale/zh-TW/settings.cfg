[mod-setting-name]
rich-resources-multiplier=資源豐富度倍率
rich-resources-randomness-factor=隨機波動因子
richresources-apply-to-existing-ores=應用到已生成的礦脈
richresources-reset-processed-list=重設已處理列表
rich-resources-infinite-min-base=無限資源最低基數值
rich-resources-finite-min-base=有限資源最低基數值
richresources-tasks-per-tick=每Tick最大任務數 (效能)
rich-resources-maintenance-multiplier=維護倍率（僅限已處理資源）
richresources-apply-maintenance=應用維護倍率
richresources-enable-distance-bonus=啟用距離加成
richresources-distance-interval=距離加成間隔（格）
richresources-distance-rate=距離加成比率

[mod-setting-description]
rich-resources-multiplier=設定所有資源豐富度的倍率。\n影響新生成的區塊。
rich-resources-randomness-factor=為倍率添加隨機波動。\n例如：倍率 2.0，因子 0.2 -> 結果在 1.8 到 2.2 之間變化。
richresources-apply-to-existing-ores=如果啟用，模組也將把更改應用到已發現的礦脈。
richresources-reset-processed-list=切換此設定 (ON<->OFF) 將清除此模組處理過的礦石列表並增加世代數。\n[color=red]如果「應用到已生成的礦脈」開啟，切換時倍率將立即重新應用到所有礦脈。[/color]
rich-resources-infinite-min-base=如果無限資源（如石油）的數量低於此值，則在乘法計算前使用此值作為基數。\n用於確保枯竭的油井能恢復到合理的產量。預設值：30000 (10%)
rich-resources-finite-min-base=如果有限資源的數量低於此值，則在乘法計算前使用此值作為基數。
richresources-tasks-per-tick=每Tick（1/60秒）處理的最大區塊數。\n控制應用更改的速度。數值越高完成越快，但可能會導致UPS下降。\n推薦值：10（低配置），50（標準），200（高效能）。
rich-resources-maintenance-multiplier=設定僅應用於已被此模組處理過的資源的倍率。
richresources-apply-maintenance=切換此設定 (ON<->OFF) 將立即把「維護倍率」應用到已處理的資源。\n[color=yellow]未處理的資源將被忽略。[/color]
richresources-enable-distance-bonus=如果啟用，將根據距離起始位置 (0,0) 的遠近添加額外的倍率。\n公式：最終倍率 = 基礎倍率 * (1 + (距離 / 間隔) * 比率)
richresources-distance-interval=用於計算的距離間隔（以格為單位）。預設值：1000
richresources-distance-rate=每個間隔增加的額外倍率係數。\n例如：0.5 表示每個間隔最終倍率增加 50%。

[gui]
rich-resources-applied-message=已將倍率應用到資源礦脈。

[message]
rich-resources-multiplier-updated=倍率已更新為: __1__
rich-resources-stops-applying=停止應用到現有礦石。
rich-resources-processed-chunks-reset=已處理區塊列表重設。世代: __1__
rich-resources-queueing-maintenance=正在將維護任務加入佇列 (x__1__)...
rich-resources-started-queued-task=開始執行佇列任務: __1__ x__2__
rich-resources-finished-applying=已完成應用到現有區塊。
rich-resources-starting-next-job=開始下一個佇列任務: __1__
rich-resources-job-already-running=任務已經在執行中。
rich-resources-recalculation-started=開始重新計算現有資源: __1__ 區塊
